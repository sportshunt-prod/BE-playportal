name: Deploy PlayPortal Backend

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version to deploy (e.g., v1.0.0 or manual-YYYYMMDD-HHMMSS). Leave empty for auto-generated tag.'
        required: false
        type: string

env:
  ACR_NAME: sportshuntprod
  ACR_LOGIN_SERVER: sportshuntprod.azurecr.io
  IMAGE_NAME: playportal-be
  RESOURCE_GROUP: rg-playportal-prod
  WEBAPP_NAME: be-playportal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Container Registry Login
        run: az acr login --name $ACR_NAME

      - name: Determine Image Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.tag }}" ]; then
              TAG="manual-$(date +%Y%m%d-%H%M%S)"
            else
              TAG="${{ github.event.inputs.tag }}"
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Build and Push Image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ steps.tag.outputs.tag }} \
            --tag $ACR_LOGIN_SERVER/$IMAGE_NAME:prod-latest \
            --push \
            .

      - name: Update Web App Container
        run: |
          az webapp config container set \
            --resource-group $RESOURCE_GROUP \
            --name $WEBAPP_NAME \
            --container-image-name $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ steps.tag.outputs.tag }}

      - name: Restart Web App
        run: az webapp restart --resource-group $RESOURCE_GROUP --name $WEBAPP_NAME

